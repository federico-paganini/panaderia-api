<!doctype html>
<html lang="es-UY">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Paints the browser UI to match the page in each scheme. Values are the
		     `--color-canvas` token from `src/lib/styles/_themes.scss`; keep in sync. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f1e4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191510" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
