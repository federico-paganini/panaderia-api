name: Quality gate (backend)

# See `backend/docs/CI.md` for this gate and its open items, and the repo-wide
# `docs/CI.md` for the branch model and the path-filter trade-off.
on:
  push:
    branches: [main, claude-master]
    paths:
      # Deliberately not `backend/**`: that would compile Rust to review a
      # change to `backend/docs/`, which `quality-docs.yml` owns.
      - 'backend/src/**'
      - 'backend/Cargo.toml'
      - 'backend/Cargo.lock'
      - '.github/workflows/quality-backend.yml'
  pull_request:
    branches: [main, claude-master]
    paths:
      # Deliberately not `backend/**`: that would compile Rust to review a
      # change to `backend/docs/`, which `quality-docs.yml` owns.
      - 'backend/src/**'
      - 'backend/Cargo.toml'
      - 'backend/Cargo.lock'
      - '.github/workflows/quality-backend.yml'

concurrency:
  group: quality-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so the audit tool is reproducible AND so its cache key is stable.
  CARGO_AUDIT_VERSION: '0.22.2'

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Audit, format, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The runner ships a current stable toolchain; only the components are
      # missing, so this avoids a third-party action for two lines.
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # A SEPARATE cache, keyed on the tool's own version rather than on the
      # project's lockfile. Sharing the cache above was a mistake: it meant
      # every dependency bump invalidated the entry and recompiled cargo-audit
      # from source — exactly when Dependabot generates the most runs. Keyed
      # this way the compile is paid once per tool version, for the life of the
      # repository.
      - name: Cache cargo-audit
        id: audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        # No `|| true`: a failure to install the audit tool must fail the gate,
        # not silently skip the audit.
        run: cargo install cargo-audit --locked --version ${{ env.CARGO_AUDIT_VERSION }}

      - name: Dependency vulnerability audit
        run: cargo audit

      # Formatting first: it needs no compilation, so a formatting-only failure
      # reports in seconds instead of after a full build.
      - name: Verify formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
