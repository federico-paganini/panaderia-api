# Production deploy of the site to Vercel.
#
# NOT `push: branches: [main]`, which is the obvious shape and the wrong one
# here. That only orders correctly when the quality gate is a REQUIRED status
# check, so nothing can land on main without passing — and the gates are not
# required in this repository, because a path-filtered workflow that gets
# skipped never reports a status (see frontend/docs/CI.md). Chaining on the gate's own
# completion is what actually guarantees a red gate never ships.
#
# Consequence worth knowing: a push to main that touches only `backend/` or
# `docs/` never runs the frontend gate, so this never fires. That is correct —
# there is nothing new to deploy — but it means the site is not redeployed by
# every commit. Use the manual trigger when you want one anyway.
#
# NOTE: this couples to the gate's exact display name. Renaming
# "Quality gate (frontend)" silently stops every deploy.
name: Deploy prod (Vercel)

on:
  workflow_run:
    workflows: ['Quality gate (frontend)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Queued, never cancelled: concurrent merges serialise into successive
# deploys instead of racing to overwrite each other's rollout.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  # Pinned, and matching the CLI verified locally. Vercel's own CI guidance is
  # explicit that `@latest` can break a pipeline on an unrelated release.
  VERCEL_CLI_VERSION: '59.16.0'

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    # A gate run that failed still fires `completed`. Without this the workflow
    # would deploy exactly the builds it exists to stop.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nothing here touches the GitHub API — checkout is the only GITHUB_TOKEN
    # consumer, and the deploy authenticates with VERCEL_TOKEN. Pinned so a
    # later change to the repository's default permissions cannot widen it.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # `workflow_run` checks out the default branch by default, not the
          # commit the gate ran on. Pin it explicitly so the deploy ships the
          # revision that was actually verified.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          # No authenticated git operations here; don't leave the token behind
          # in .git/config on a runner that holds the deploy credentials.
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build
        # `pnpm build` is the whole build: the SvelteKit Vercel adapter writes
        # the Build Output API directory (`.vercel/output`) itself, so
        # `vercel build` has nothing left to do. Skipping it is not only leaner
        # — it is what keeps the deploy token scoped to this one project.
        run: pnpm install --frozen-lockfile && pnpm build

      # Pinned, not `@latest`: a CLI that updates itself under the pipeline
      # turns an unrelated release into a failed deploy. Installed through npm
      # rather than `pnpm add --global`, whose bin directory is not on PATH
      # until `pnpm setup` has run — which it has not on a fresh runner.
      - name: Install the Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # `vercel link` writes this file locally and it is gitignored, so the
      # runner has no copy. Without it the CLI infers the project from the
      # environment and, on that path, resolves the authenticated USER — which
      # a project-scoped token cannot do. Writing the two ids it would have
      # contained keeps the narrow token working without `vercel pull`.
      #
      # Written with printf from env, never interpolated into the script body:
      # `${{ }}` is substituted before the shell parses the line.
      - name: Link the project without pulling
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      # Authentication is the `VERCEL_TOKEN` environment variable, never the
      # command-line flag: a flag lands in the runner's process listing, where
      # any other step on that machine can read it.
      #
      # `vercel pull` and `vercel build` are deliberately absent. Both resolve
      # the authenticated USER before doing anything, which a project-scoped
      # token cannot do — it can read its own project and nothing else, which is
      # the entire point of it. `deploy --prebuilt` makes no such call, so the
      # narrow token works and the account-wide one is not needed.
      #
      # The consequence to remember: without `vercel pull`, environment
      # variables configured in Vercel never reach this build. There are none
      # today. The day there are, they have to come from repository secrets
      # here, not from Vercel's dashboard.
      #
      # `vercel deploy` prints the deployment URL on stdout; capturing it puts
      # the address on the run summary instead of leaving it buried in a log.
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy"
            echo
            echo "- **URL**: $url"
            echo "- **Target**: production"
            echo "- **Commit**: ${GITHUB_SHA:0:7}"
          } >> "$GITHUB_STEP_SUMMARY"
